version: "3.8"
services:
  uldas:
    container_name: uldas
    image: netplexflix/uldas:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York # Set your timezone
      # CRON schedule (optional). Runs on container start + on schedule.
      # Examples:
      #   "0 3 * * *"    = every day at 3:00 AM
      #   "0 */6 * * *"  = every 6 hours
      #   "0 5 * * 5"   = every Friday at 5:00 AM
      # Leave empty or remove to run once and exit.
      - CRON_SCHEDULE=0 5 * * 5
    ports:
      - "2119:2119"
    volumes:
      - ./config:/app/config
      - /path/to/folder1:/folder1
      - /path/to/folder2:/folder2
      # Optional: mount custom temp directory:
      # - /path/to/temp:/tmp/uldas
    # Optional: NVIDIA GPU acceleration. Requires the NVIDIA Container Toolkit
    # to be installed on the host first (Unraid: the "Nvidia-Driver" plugin):
    # https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
    # Without this ULDAS runs on CPU. Intel/AMD GPUs are not supported.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped